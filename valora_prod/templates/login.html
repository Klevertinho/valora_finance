{% extends 'auth_layout.html' %}
{% block content %}
<div class="auth-head">
  <span class="eyebrow">Entrar</span>
  <h2>Entrar na Valora Finance</h2>
  <p>Entre para continuar gerindo seu negócio.</p>
</div>
<form method="post" class="auth-form">
  <label>Email<input type="email" name="email" value="{{ email or '' }}" placeholder="seu@email.com" required></label>
  <label>Senha<input type="password" name="password" placeholder="Sua senha" required></label>
  <button class="btn btn-primary wide" type="submit">Entrar</button>
</form>
<div class="auth-links">
  <a href="{{ url_for('recuperar_senha') }}">Esqueci minha senha</a>
  <a href="{{ url_for('cadastro') }}">Criar conta</a>
</div>
<div class="demo-login-note">Conta demo local: <b>demo@valora.local</b> / <b>demo1234</b></div>
{% endblock %}
